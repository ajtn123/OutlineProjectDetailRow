name: Build .NET App

on:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: windows-latest
    env:
      project: DuplicateCheckerConsole
    steps:
      - uses: actions/checkout@v6

      - name: Publish
        run: dotnet publish ${{ env.project }} -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-archive
          path: ${{ env.project }}/bin/Release/**/publish
